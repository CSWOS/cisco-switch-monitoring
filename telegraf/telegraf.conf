[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "30s"
  hostname = ""
  omit_hostname = false

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]

[[inputs.gnmi]]
  addresses = [
    "192.168.1.10:50051",   # CHANGE to your real switch IP
  ]
  username = "admin"
  password = "your_password"
  encoding = "proto"
  redial = "10s"

  [[inputs.gnmi.subscription]]
    name = "interfaces"
    origin = "openconfig-interfaces"
    path = "/interfaces/interface/state"
    subscription_mode = "sample"
    sample_interval = "30s"

  [[inputs.gnmi.subscription]]
    name = "interface_counters"
    origin = "openconfig-interfaces"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "30s"

  [[inputs.gnmi.subscription]]
    name = "system"
    origin = "openconfig-system"
    path = "/system/state"
    subscription_mode = "sample"
    sample_interval = "60s"

  [[inputs.gnmi.subscription]]
    name = "cpu"
    origin = "openconfig-system"
    path = "/system/cpus/cpu/state"
    subscription_mode = "sample"
    sample_interval = "30s"

  [[inputs.gnmi.subscription]]
    name = "memory"
    origin = "openconfig-system"
    path = "/system/memory/state"
    subscription_mode = "sample"
    sample_interval = "60s"

  [[inputs.gnmi.subscription]]
    name = "bgp_neighbors"
    origin = "openconfig-network-instance"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state"
    subscription_mode = "sample"
    sample_interval = "60s"

  [[inputs.gnmi.subscription]]
    name = "ospf"
    origin = "openconfig-network-instance"
    path = "/network-instances/network-instance/protocols/protocol/ospfv2"
    subscription_mode = "sample"
    sample_interval = "60s"
