[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "30s"
  hostname = ""
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# ============================================
# Cisco Model-Driven Telemetry (Dial-Out / Push)
# Switches push data TO this Telegraf instance
# ============================================
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"

  # Optional aliases to make metric names cleaner
  [inputs.cisco_telemetry_mdt.aliases]
    ifstats = "ietf-interfaces:interfaces-state/interface/statistics"
    cpu = "process-cpu-ios-xe-oper:cpu-usage/cpu-utilization"
    memory = "memory-ios-xe-oper:memory-statistics/memory-statistic"
